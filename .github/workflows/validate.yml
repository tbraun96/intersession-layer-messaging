name: Validate PR
on:
  workflow_call:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full
  # 40 MiB stack
  RUST_MIN_STACK: 40971520
  RUST_LOG: "ism=trace"

jobs:
  tests:
    strategy:
      # Windows never reported. When macOS failed, the default fail-fast
      # cancelled Windows mid-`nextest run`, so what the PR showed as a Windows
      # failure was a cancellation with no test output and no artifact. Each
      # platform must finish on its own so its measurement gets uploaded.
      fail-fast: false
      matrix:
        os: [ ubuntu-24.04, macos-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: Avarok-Cybersecurity/gh-actions-deps@master
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run --features=testing
      # The idle-send timing test writes its measurement to a file, because
      # nextest truncates captured stdout before the panic and the first
      # macOS/Windows failure produced no number at all. Uploaded on failure
      # so the bound can be judged against a value rather than a guess.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: idle-send-measurement-${{ matrix.os }}
          path: target/idle-send-measurement.txt
          if-no-files-found: ignore

  clippy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: Avarok-Cybersecurity/gh-actions-deps@master
      - run: rustup component add clippy-preview
      - run: cargo clippy --tests --features=testing -- -D warnings

  # The codecs are off by default, so neither job above compiles them. Without
  # this job the compression module, its bomb guard and every test that
  # negotiates a codec would be green by never having been built.
  codecs:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: Avarok-Cybersecurity/gh-actions-deps@master
      - uses: taiki-e/install-action@nextest
      - run: rustup component add clippy-preview
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo nextest run --features=testing,compression-brotli,compression-deflate,compression-zstd
      - run: cargo clippy --tests --features=testing,compression-brotli,compression-deflate,compression-zstd -- -D warnings
      # Each codec alone: `DynamicCompression::All` and the codec tables are
      # cfg-gated per feature, and one-feature builds are where those break.
      - run: cargo clippy --tests --features=testing,compression-brotli -- -D warnings
      - run: cargo clippy --tests --features=testing,compression-deflate -- -D warnings
      - run: cargo clippy --tests --features=testing,compression-zstd -- -D warnings
      # The browser's set: zstd and deflate, no brotli.
      - run: cargo nextest run --features=testing,compression-zstd,compression-deflate
      # The browser is the reason these are pure Rust.
      - run: cargo build --target wasm32-unknown-unknown --features=compression-brotli,compression-deflate,compression-zstd

  fmt:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: Avarok-Cybersecurity/gh-actions-deps@master
      - run: cargo fmt --check --all
      - name: Every hosted Linux runner names its release
        run: sh ci/check-runner-images-are-pinned.sh

  # Branch protection can require ONE name that is true only when every job above succeeded. A job
  # skipped because of an earlier failure reads as passing to a per-job rule; this one does not.
  all-checks:
    name: All checks
    if: always()
    needs: [tests, clippy, codecs, fmt]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -eu
          bad=$(printf '%s' "$RESULTS" | jq -r 'to_entries[] | select(.value.result != "success") | "\(.key)=\(.value.result)"')
          total=$(printf '%s' "$RESULTS" | jq 'length')
          [ "$total" -gt 0 ] || { echo "::error::needs is empty; this aggregate judged nothing"; exit 1; }
          [ -z "$bad" ] || { echo "::error::not every job succeeded: $(echo "$bad" | tr '\n' ' ')"; exit 1; }
          echo "all $total jobs succeeded"
