name: Validate PR
on:
  workflow_call:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full
  # 40 MiB stack
  RUST_MIN_STACK: 40971520
  RUST_LOG: "ism=trace"

jobs:
  tests:
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: Avarok-Cybersecurity/gh-actions-deps@master
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run --features=testing
      # The idle-send timing test writes its measurement to a file, because
      # nextest truncates captured stdout before the panic and the first
      # macOS/Windows failure produced no number at all. Uploaded on failure
      # so the bound can be judged against a value rather than a guess.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: idle-send-measurement-${{ matrix.os }}
          path: target/idle-send-measurement.txt
          if-no-files-found: ignore

  clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: Avarok-Cybersecurity/gh-actions-deps@master
      - run: rustup component add clippy-preview
      - run: cargo clippy --tests --features=testing -- -D warnings

  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: Avarok-Cybersecurity/gh-actions-deps@master
      - run: cargo fmt --check --all